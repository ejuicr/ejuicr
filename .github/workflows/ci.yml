name: CI

on:
  # CI owns validation; after approved activation, normal master pushes deploy.
  push:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  # Never cancel a workflow which may already be rolling out production.
  cancel-in-progress: false

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Test-only configuration: the suite never needs production secrets or
      # a production database. The integration tests create and drop a
      # temporary database on the service container.
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017
      MONGODB_URI: mongodb://127.0.0.1:27017/ejuicr_ci
      JWT_SECRET: ci-only-jwt-secret
      # CI uses the service container, so skip the mongodb-memory-server
      # binary download during npm ci.
      MONGOMS_DISABLE_POSTINSTALL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Offline deployment-client check
        run: python3 scripts/test-deploy-mothership.py
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Database-backed integration tests
        run: npm run test:integration
      - name: Production build
        run: npm run build
      - name: Install Firefox for the smoke suite
        run: npx playwright install --with-deps firefox
      - name: Browser smoke tests
        run: npm run test:e2e

  publish:
    name: Container image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publication.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        env:
          NEXT_PUBLIC_DONATION_LINK: ${{ vars.NEXT_PUBLIC_DONATION_LINK }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
          NEXT_PUBLIC_FEEDBACK_EMAIL: ${{ vars.NEXT_PUBLIC_FEEDBACK_EMAIL }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          echo "APP_IMAGE=$image" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_DONATION_LINK \
            --build-arg NEXT_PUBLIC_SUPPORT_EMAIL \
            --build-arg NEXT_PUBLIC_FEEDBACK_EMAIL \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image" .
      - name: Test image without production services
        run: bash scripts/test-container.sh "$APP_IMAGE"
      - name: Publish image
        id: publication
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$APP_IMAGE"
          digest=$(docker image inspect "$APP_IMAGE" --format '{{index .RepoDigests 0}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Published image digest: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Production deployment
    needs: publish
    # Explicit activation stays off until ticket 007's scoped setup is accepted.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.MOTHERSHIP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ejuicr-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Deploy exact tested digest
        env:
          DEPLOY_IMAGE: ${{ needs.publish.outputs.digest }}
          DEPLOY_SSH_KEY: ${{ secrets.MOTHERSHIP_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.MOTHERSHIP_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.MOTHERSHIP_DEPLOY_HOST }}
        run: bash scripts/deploy-mothership.sh
