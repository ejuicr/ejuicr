<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — ejuicr prototype</title>
    <link rel="icon" href="assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="reset-password" data-chrome="auth">
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="auth-main">
      <div class="auth-wrap">
        <div class="auth-card">
          <h1>Reset password</h1>
          <p class="auth-sub">
            Enter your email and we&rsquo;ll send you a link to choose a new
            password.
          </p>

          <form class="auth-form">
            <div class="auth-field">
              <label for="reset-email">Email</label>
              <input class="input" id="reset-email" type="email" autocomplete="email" />
            </div>
            <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
          </form>

          <p class="auth-alt">
            Remembered it? <a href="signin.html">Sign in</a>.
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
