<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — ejuicr prototype</title>
    <link rel="icon" href="assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="signin" data-chrome="auth">
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="auth-main">
      <div class="auth-wrap">
        <div class="auth-card">
          <h1>Sign in</h1>
          <p class="auth-sub">Save recipes and keep your mixing defaults.</p>

          <a class="btn provider-btn provider-google" href="#">
            <img src="assets/google-logo.svg" alt="" width="18" height="18" />
            Sign in with Google
          </a>
          <a class="btn provider-btn provider-x" href="#">
            <img src="assets/x-logo.svg" alt="" width="18" height="18" />
            Sign in with X
          </a>

          <div class="auth-divider">or</div>

          <form class="auth-form">
            <div class="auth-field">
              <label for="signin-email">Email</label>
              <input class="input" id="signin-email" type="email" autocomplete="email" />
            </div>
            <div class="auth-field">
              <label for="signin-password">Password</label>
              <input
                class="input"
                id="signin-password"
                type="password"
                autocomplete="current-password"
              />
            </div>
            <button class="btn btn-primary btn-block" type="submit">Sign in</button>
          </form>

          <p class="auth-alt">
            Need an account? <a href="signup.html">Sign up instead</a>.
          </p>
          <p class="auth-alt">
            <a href="reset-password.html">Forgot your password?</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
